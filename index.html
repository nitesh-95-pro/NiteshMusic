<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ff2d55" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Nitesh Music" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <title>Nitesh Music</title>
  <link rel="icon" type="image/png" href="./icons/favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Ambient Wave Layer -->
  <svg class="ambient-waves-layer" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"
    preserveAspectRatio="none">
    <path class="wave-path wave-1" d="M -100,150 C 300,-50 500,400 900,120 C 1300,-100 1600,350 2050,180" />
    <path class="wave-path wave-2" d="M -50,450 C 350,750 650,200 1100,550 C 1450,800 1700,300 2050,480" />
    <path class="wave-path wave-3" d="M 50,900 C 400,600 750,1050 1200,750 C 1550,500 1800,950 2050,850" />
    <path class="wave-path wave-4" d="M -100,700 C 250,300 600,800 1050,400 C 1400,100 1750,600 2050,300" />
    <path class="wave-path wave-5" d="M 100,-80 C 450,400 250,750 750,600 C 1200,450 1500,950 2000,650" />
    <path class="wave-path wave-6" d="M -50,1050 C 500,800 950,1100 1400,850 C 1700,650 1900,1050 2050,980" />
  </svg>

  <div class="app-shell">
    <!-- DESKTOP SIDEBAR -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <button id="sidebar-toggle-btn" class="toggle-icon-btn" aria-label="Toggle Sidebar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
          </svg>
        </button>
      </div>

      <nav class="nav-stack">
        <button class="nav-link active" data-view="library">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" />
          </svg>
          <span class="nav-label">Library</span>
        </button>
        <button class="nav-link" data-view="favorites">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path
              d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
          </svg>
          <span class="nav-label">Favorites</span>
        </button>
        <button class="nav-link" data-view="all-playlists">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
          </svg>
          <span class="nav-label">Playlists</span>
        </button>
        <button class="nav-link" data-view="downloads">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z" />
          </svg>
          <span class="nav-label">Downloads</span>
        </button>
        <button id="import-yt-btn" class="nav-link">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path
              d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z" />
          </svg>
          <span class="nav-label">Import Songs</span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <span class="nav-label version-tag">Nitesh Music</span>
      </div>
    </aside>

    <!-- MAIN VIEWPORT -->
    <div class="main-content">
      <header class="navbar">
        <div class="search-bar">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path
              d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
          </svg>
          <input type="text" id="search-box" placeholder="Search songs, artists..." autocomplete="off" />
        </div>

        <div class="navbar-brand-zone">
          <span class="navbar-brand-title">Nitesh Music</span>
          <img src="./icons/icon-192.png" alt="Logo" class="navbar-brand-logo"
            onerror="this.src='https://placehold.co/40x40/ff2d55/ffffff?text=H'" />
        </div>
      </header>

      <main class="gallery-viewport">
        <div class="section-title">
          <div class="title-left">
            <h2>Library</h2>
            <span id="catalog-count">0 tracks</span>
          </div>

          <button id="view-toggle-btn" class="glass-icon-btn" aria-label="Toggle View" title="Toggle Grid / List View">
            <svg id="view-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z" />
            </svg>
          </button>
        </div>
        <div id="grid-container" class="cards-grid"></div>
      </main>
    </div>
  </div>

  <!-- PERSISTENT / MINI DOCK CONTROLLER -->
  <footer id="bottom-dock" class="bottom-dock">
    <div class="mini-progress-rail">
      <div id="mini-progress-fill" class="mini-progress-fill"></div>
    </div>

    <div class="dock-meta" id="dock-meta-click">
      <img id="dock-cover" src="./covers/track01_cover.jpg" alt="Cover" />
      <div class="meta-texts">
        <h4 id="dock-title">Loading Track...</h4>
        <p id="dock-artist">Please wait</p>
      </div>
    </div>

    <div class="dock-mid">
      <div class="progress-block desktop-progress">
        <span id="curr-time">0:00</span>
        <div class="rail-capsule">
          <div id="rail-fill" class="rail-fill"></div>
          <input type="range" id="seek-bar" min="0" max="100" value="0" step="0.1" />
        </div>
        <span id="dur-time">0:00</span>
      </div>

      <div class="mid-actions">
        <button id="btn-shuffle" class="btn-ctrl" title="Shuffle">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path
              d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z" />
          </svg>
        </button>
        <button id="btn-prev" class="btn-ctrl" aria-label="Previous">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" />
          </svg>
        </button>
        <button id="btn-play" class="btn-ctrl play-bubble" aria-label="Play/Pause">
          <svg id="play-svg" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M8 5v14l11-7z" />
          </svg>
        </button>
        <button id="btn-next" class="btn-ctrl" aria-label="Next">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="m6 18 8.5-6L6 6v12zM16 6v12h2V6h-2z" />
          </svg>
        </button>
        <button id="btn-repeat" class="btn-ctrl active-mode" title="Loop Mode" style="position: relative;">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z" />
          </svg>
          <span id="repeat-badge" class="repeat-badge">∞</span>
        </button>
      </div>
    </div>

    <div class="dock-volume">
      <button id="mute-toggle-btn" class="volume-btn" aria-label="Toggle Mute">
        <svg id="volume-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z" />
        </svg>
      </button>
      <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="1" />
      <button id="btn-pc-fullscreen" class="btn-ctrl pc-fullscreen-btn" title="Fullscreen Player"
        aria-label="Fullscreen Player">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
        </svg>
      </button>
    </div>
  </footer>

  <!-- 4-ICON MOBILE & TABLET BOTTOM BAR -->
  <nav class="mobile-bottom-nav">
    <button class="mobile-nav-btn active" data-view="library">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" />
      </svg>
      <span>Library</span>
    </button>
    <button class="mobile-nav-btn" data-view="favorites">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path
          d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
      </svg>
      <span>Favorites</span>
    </button>
    <button class="mobile-nav-btn" data-view="all-playlists">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
      </svg>
      <span>Playlists</span>
    </button>
    <button class="mobile-nav-btn" data-view="downloads">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z" />
      </svg>
      <span>Downloads</span>
    </button>
  </nav>

  <!-- IMMERSIVE FULLSCREEN SHEET -->
  <div id="fullscreen-sheet" class="fullscreen-sheet">
    <div class="sheet-header auto-fade-elem">
      <button id="sheet-close-btn" class="glass-icon-btn"><svg viewBox="0 0 24 24" width="20" height="20"
          fill="currentColor">
          <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z" />
        </svg></button>
      <span>Now Playing</span>
      <div style="width:44px;"></div>
    </div>

    <!-- Center Display Area (Artwork vs Synced Lyrics) -->
    <div class="sheet-body-container">
      <div id="sheet-artwork-panel" class="sheet-artwork active">
        <img id="sheet-cover" src="./covers/track01_cover.jpg" alt="Art" />
      </div>

      <div id="sheet-lyrics-panel" class="sheet-lyrics-container">
        <div id="lyrics-stream" class="lyrics-stream">
          <p class="lyric-line placeholder">No synchronized lyrics available for this track.</p>
        </div>
      </div>
    </div>

    <!-- Centered compact bottom player panel -->
    <div class="sheet-bottom-panel">
      <div class="sheet-meta">
        <h2 id="sheet-title">Song Title</h2>
        <p id="sheet-artist">Artist Name</p>
      </div>

      <!-- Action Toolbar Directly Above Timeline -->
      <div class="sheet-utility-row">
        <button id="sheet-lyrics-btn" class="sheet-action-pill" title="Toggle Lyrics">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z"/>
          </svg>
          <span>Lyrics</span>
        </button>

        <div class="sheet-utility-subgroup">
          <button id="sheet-add-p-btn" class="glass-icon-btn sheet-mini-btn" title="Add to Playlist">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
            </svg>
          </button>
          <button id="sheet-dl-btn" class="glass-icon-btn sheet-mini-btn" title="Download Offline">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z" />
            </svg>
          </button>
        </div>
      </div>

      <div class="sheet-scrub">
        <div class="rail-capsule sheet-capsule">
          <div id="sheet-rail-fill" class="rail-fill"></div>
          <input type="range" id="sheet-seek-bar" min="0" max="100" value="0" step="0.1" />
        </div>
        <div class="sheet-times"><span id="sheet-curr">0:00</span><span id="sheet-dur">0:00</span></div>
      </div>

      <div class="sheet-controls">
        <button id="sheet-shuffle" class="btn-ctrl"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path
              d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z" />
          </svg></button>
        <button id="sheet-prev" class="btn-ctrl"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" />
          </svg></button>
        <button id="sheet-play" class="btn-ctrl play-bubble sheet-play-btn"><svg id="sheet-play-svg" viewBox="0 0 24 24"
            width="26" height="26" fill="currentColor">
            <path d="M8 5v14l11-7z" />
          </svg></button>
        <button id="sheet-next" class="btn-ctrl"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="m6 18 8.5-6L6 6v12zM16 6v12h2V6h-2z" />
          </svg></button>
        <button id="sheet-repeat" class="btn-ctrl active-mode" style="position: relative;"><svg viewBox="0 0 24 24" width="20" height="20"
            fill="currentColor">
            <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z" />
          </svg>
          <span id="sheet-repeat-badge" class="repeat-badge">∞</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Playlist Picker Modal -->
  <div id="playlist-modal" class="modal-overlay">
    <div class="glass-modal">
      <div class="modal-header">
        <h3>Add to Playlist</h3>
        <button id="playlist-modal-close-btn" class="modal-close-btn">&times;</button>
      </div>
      <div id="playlist-picker-list" class="playlist-picker-list"></div>
      <form id="create-playlist-form" class="create-playlist-form">
        <input type="text" id="new-playlist-input" placeholder="New Playlist Name..." required />
        <button type="submit">Create</button>
      </form>
    </div>
  </div>

  <!-- YouTube Modal -->
  <div id="yt-import-modal" class="modal-overlay">
    <div class="glass-modal">
      <div class="modal-header">
        <h3>Import from YouTube</h3>
        <button id="yt-modal-close-btn" class="modal-close-btn">&times;</button>
      </div>
      <form id="yt-import-form" class="create-playlist-form" style="flex-direction: column;">
        <input type="url" id="yt-url-input" placeholder="Paste YouTube link here..." required />
        <button type="submit" id="yt-submit-btn" style="width: 100%; height: 44px;">Download & Add</button>
      </form>
      <div id="yt-status-msg" style="font-size: 0.8rem; color: var(--text-muted); text-align: center;"></div>
    </div>
  </div>

  <!-- Global Toast Notification -->
  <div id="toast-notice" class="toast-notice"></div>

  <audio id="audio-core" preload="metadata"></audio>
  <script src="app.js"></script>
</body>

</html>
